name: URnetwork Redraw

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redraw
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check / redraw node
        env:
          URNETWORK_API_KEY: ${{ secrets.URNETWORK_API_KEY }}
        run: python scripts/draw.py
      - name: Publish to Pages (commit docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "node unchanged"
          else
            git commit -m "update node $(date -u +%FT%TZ)"
            git push
          fi
